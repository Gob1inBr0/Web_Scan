name: tests

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install paramiko numpy
      - name: Run test suite
        run: python web/tools/run_tests.py

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check frontend modules
        run: |
          mkdir -p /tmp/jscheck
          for f in web/src/core/app.js web/src/api/server-client.js; do
            cp "$f" "/tmp/jscheck/$(basename "$f" .js).mjs"
            node --check "/tmp/jscheck/$(basename "$f" .js).mjs"
          done
