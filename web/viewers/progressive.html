<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGS Progressive Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
      #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
      #message, #spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
      #hud {
        position: absolute; top: 10px; left: 10px; z-index: 20;
        background: rgba(10, 13, 18, 0.82); border: 1px solid #2a3444;
        border-radius: 8px; padding: 10px 13px;
        font: 11.5px/1.55 ui-monospace, Menlo, monospace; color: #a8bccf;
        min-width: 250px; pointer-events: none;
      }
      #hud b { color: #e9eef5; }
      #hud .k { color: #64748b; display: inline-block; width: 118px; }
      #hud .bar { height: 5px; background: #1a2230; border-radius: 3px; margin: 5px 0 2px; overflow: hidden; }
      #hud .bar > div { height: 100%; background: linear-gradient(90deg, #3d7bf0, #4d8dff); width: 0; }
      #spinner .cube { width: 34px; height: 34px; border: 3px solid #4d8dff; border-radius: 6px; animation: spin 1.1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script>
    // Diagnostics: surface worker/module errors into the page for tests.
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(String(e.message || e.error)));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push("promise: " + ((e.reason && e.reason.message) || e.reason)));
    const _origError = console.error.bind(console);
    console.error = (...args) => {
      window.__errors.push(args.map((a) => (a && a.stack) ? String(a.stack).slice(0, 300) : String(a)).join(" "));
      _origError(...args);
    };
  </script>
  <div id="hud">loading…</div>
    <div id="message"></div>
    <div id="spinner"><div class="cube"></div></div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./progressive.js"></script>
  </body>
</html>
