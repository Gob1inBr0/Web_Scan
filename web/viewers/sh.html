<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SH Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
      #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
      #progress { position: absolute; inset: 0 auto auto 0; height: 4px; background: #ffb449; width: 0; z-index: 20; }
      #message, #spinner, #quality, #caminfo { position: absolute; z-index: 10; }
      #message, #spinner { inset: 0; display: flex; align-items: center; justify-content: center; }
      #quality { right: 14px; bottom: 10px; font-size: 48px; }
      #caminfo { top: 12px; right: 12px; font-size: 12px; }
      .cube-wrapper { transform-style: preserve-3d; }
      .cube { transform-style: preserve-3d; transform: rotateX(45deg) rotateZ(45deg); animation: rotation 2s infinite; }
      .cube-faces { transform-style: preserve-3d; height: 72px; width: 72px; position: relative; transform-origin: 0 0; transform: translateZ(-36px); }
      .cube-face { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.6); background: #ff9d0d; }
      .cube-face.top { transform: translateZ(72px); }
      .cube-face.front { transform-origin: 0 50%; transform: rotateY(-90deg); }
      .cube-face.back { transform-origin: 0 50%; transform: rotateY(-90deg) translateZ(-72px); }
      .cube-face.right { transform-origin: 50% 0; transform: rotateX(-90deg) translateY(-72px); }
      .cube-face.left { transform-origin: 50% 0; transform: rotateX(-90deg) translateY(-72px) translateZ(72px); }
      @keyframes rotation {
        0% { transform: rotateX(45deg) rotateZ(45deg); }
        50% { transform: rotateX(45deg) rotateZ(225deg); }
        100% { transform: rotateX(45deg) rotateZ(405deg); }
      }
    </style>
  </head>
  <body>
    <div id="progress"></div>
    <div id="message"></div>
    <div id="spinner">
      <div class="cube-wrapper">
        <div class="cube">
          <div class="cube-faces">
            <div class="cube-face bottom"></div>
            <div class="cube-face top"></div>
            <div class="cube-face left"></div>
            <div class="cube-face right"></div>
            <div class="cube-face back"></div>
            <div class="cube-face front"></div>
          </div>
        </div>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="quality"><span id="fps"></span></div>
    <div id="caminfo"><span id="camid"></span></div>
    <script src="./megs-viewer.js?v=20260928-merged"></script>
  </body>
</html>
