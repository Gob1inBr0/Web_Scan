<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebScan Console</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <style>body { background: var(--bg-base); }</style>
</head>
<body>
  <div id="app"></div>
  <script>window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(JSON.stringify({ msg: e.message, file: e.filename, line: e.lineno, col: e.colno, stack: e.error && String(e.error.stack || "").slice(0, 400) })));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push("promise: " + ((e.reason && e.reason.message) || e.reason)));</script>
  <script src="./assets/vue.global.prod.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
